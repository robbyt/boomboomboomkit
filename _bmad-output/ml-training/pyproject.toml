[project]
name = "boomboomboomkit-tempo-training"
version = "0.1.0"
description = "Story 4-4b dev-only training pipeline for the reference tempo classifier (S&M-style shallow CNN). NOT shipped to main; lives in _bmad-output/."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "librosa>=0.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "coremltools>=8.0",
  "tqdm>=4.66",
  "torchinfo>=1.8",
  "mutagen>=1.47.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.15.15",
  "ty>=0.0.40",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
# scripts/audit-corpus-splits.py inserts this dir on sys.path at runtime to import
# corpus_common; make ty resolve it statically too.
extra-paths = ["."]
