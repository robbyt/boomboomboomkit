[project]
name = "boomboomboomkit-tempo-training"
version = "0.1.0"
description = "Story 4-4b dev-only training pipeline for the reference tempo classifier (S&M-style shallow CNN). NOT shipped to main; lives in _bmad-output/."
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.4",
  "torchaudio>=2.4",
  "librosa>=0.10",
  "numpy>=1.26",
  "scipy>=1.11",
  "coremltools>=8.0",
  "tqdm>=4.66",
  "torchinfo>=1.8",
  "mutagen>=1.47.0",
  "matplotlib>=3.8",
  # Story 8.7 (develop-only): beat-grid acceptance F-measure. `mir_eval.beat.f_measure`
  # has been API-stable across 0.x; pinned below the 1.0 major boundary (epic version-pin
  # guard). The `jams` library is intentionally NOT added: the multi-track `{ "entries": [...] }`
  # corpus wrapper (DD-9) is not loadable by `jams.load()` anyway, and both the generator
  # (scripts/rekordbox-beats.py) and the sidecar (eval-beatgrid.py) read/write the JAMS-shaped
  # JSON with the stdlib — so `jams` would be a dead dependency.
  "mir_eval>=0.7,<1.0",
]

[dependency-groups]
# Story 12.4 (Gate 0): TF/Keras runtime needed only to LOAD and RUN the published
# reference-baseline weights (Schreiber and Mueller ISMIR 2018 single-step tempo CNN)
# in tempocnn_baseline.py. Deliberately a group, not a core dep: nothing else in the
# training pipeline uses TensorFlow, and the torch stack must not co-resolve with it
# by default. macOS arm64 wheels exist for tensorflow >= 2.16; sub-major pinned per
# the epic version-pin guard.
tempocnn-baseline = [
  "tensorflow>=2.20,<2.21",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.15.15",
  "ty>=0.0.40",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
# scripts/audit-corpus-splits.py inserts this dir on sys.path at runtime to import
# corpus_common; make ty resolve it statically too.
extra-paths = ["."]
